name: CI

# Lint + secret-scan gate. Runs on push/PR once this repo has a GitHub remote.
# Baseline note: legacy code still has ruff violations (see CLEANUP_LOG.md). The
# rule is that the violation count must not RISE — new code is clean.

on:
  push:
    branches: [ master, main, "phase-*" ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.15.15
      - name: Ruff lint (backend, agent, rag)
        run: ruff check backend agent rag

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
